<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Paw-tastic Sitters</title>
    <!-- Supabase CDN - connects to cloud database provided by Antoine -->
    <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="paw-bg"></div>

    <nav>
        <h1 class="title" onclick="location.href='index.html'" style="cursor:pointer">Paw-tastic Sitters!</h1>
    </nav>

    <section class="form-section">
        <div class="form-box">
            <h2>Welcome Back!</h2>
            <!-- backend: handleLogin() in script.js sends these to /api/login -->
            <input type="text" placeholder="Email" id="loginEmail" oninput="validateEmail(this)">
            <p class="field-error" id="emailError"></p>
            <input type="password" placeholder="Password" id="loginPassword" oninput="validatePassword(this)">
            <p class="field-error" id="passwordError"></p>
            <button onclick="handleLogin()">Login</button>
            <p class="switch-page">Don't have an account? <span onclick="location.href='signup.html'">Sign Up</span></p>
        </div>
    </section>

    <script src="script.js"></script>

    <div id="loginError" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:999; justify-content:center; align-items:center;">
    <div class="form-box" style="width:350px; gap:15px;">
        <h2>Invalid Credentials</h2>
        <p class="switch-page" style="color:white;">No account found with that email and password. Please try again or create an account.</p>
        <button onclick="document.getElementById('loginError').style.display='none'">Try Again</button>
        <button onclick="location.href='signup.html'" style="background:rgba(255,255,255,0.1);">Create Account</button>
    </div>
</div>
</body>
</html>

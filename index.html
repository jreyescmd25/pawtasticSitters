<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetSitter App</title>
    <!-- Supabase CDN - connects to cloud database provided by Antoine -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="paw-bg"></div>

    <nav>
        <h1 class="title" onclick="location.href='index.html'" style="cursor:pointer">Paw-tastic Sitters!</h1>
        <div style="display:flex; gap:10px;">
            <!-- Shown when user is logged out -->
            <button id="loginBtn" onclick="location.href='login.html'">Login</button>
            <button id="signupBtn" onclick="location.href='signup.html'">Sign Up</button>
            <!-- Shown when user is logged in - toggled by script.js DOMContentLoaded -->
            <button id="profileBtn" style="display:none" onclick="location.href='profile.html'">My Profile</button>
            <button id="bookingsBtn" style="display:none" onclick="location.href='bookings.html'">My Bookings</button>
        </div>
    </nav>

    <section class="hero">
        <h2>Find a Pet Sitter Near You!</h2>
        <div class="search-bar" style="display:flex; flex-direction:row; align-items:center; gap:10px;">
            <!-- Zip input - numbers only, max 5 digits -->
            <input type="text" id="zipInput" placeholder="Enter your zip code..." oninput="validateZipSearch(this)" onkeypress="return event.charCode >= 48 && event.charCode <= 57">
            <!-- Redirects to search.html with zip as URL param -->
            <button onclick="searchNearby()">Search Nearby</button>
        </div>
        <p class="field-error" id="searchZipError" style="text-align:center;"></p>
        <p id="errorMsg"></p>
    </section>

    <section class="featured-sitters">
        <h2 class="section-title">Featured Sitters</h2>
        <div class="sitter-grid" id="sitterGrid">

            <!-- DECOY CARDS - delete when database is connected -->
            <!-- backend: Call loadFeaturedSitters() on page load to replace these with real data from /api/sitters -->

            <div class="sitter-card">
                <div class="sitter-avatar">🐶</div>
                <h3>Maria Lopez</h3>
                <p class="sitter-location">Bronx, NY</p>
                <div class="sitter-tags">
                    <span class="tag">Dog</span>
                    <span class="tag">Cat</span>
                </div>
                <p class="sitter-rate">$15/hr</p>
                <button onclick="openModal('Maria Lopez')">Message</button>
            </div>

            <div class="sitter-card">
                <div class="sitter-avatar">🐈</div>
                <h3>James Carter</h3>
                <p class="sitter-location">Brooklyn, NY</p>
                <div class="sitter-tags">
                    <span class="tag">Cat</span>
                    <span class="tag">Bird</span>
                </div>
                <p class="sitter-rate">$12/hr</p>
                <button onclick="openModal('James Carter')">Message</button>
            </div>

            <div class="sitter-card">
                <div class="sitter-avatar">🐾</div>
                <h3>Sofia Reyes</h3>
                <p class="sitter-location">Queens, NY</p>
                <div class="sitter-tags">
                    <span class="tag">Dog</span>
                    <span class="tag">Other</span>
                </div>
                <p class="sitter-rate">$18/hr</p>
                <button onclick="openModal('Sofia Reyes')">Message</button>
            </div>

            <!-- END DECOY CARDS -->

        </div>
    </section>

    <!-- backend: Messages stored in localStorage for now - replace with Supabase realtime messages table -->
    <div id="messageModal" style="display:none;">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modalSitterName"></h3>
                <button onclick="closeModal()" class="close-btn">✕</button>
            </div>
            <div class="chat-box" id="chatBox">
                <div class="msg received">Hey! I'm available this weekend</div>
            </div>
            <div class="chat-input">
                <input type="text" id="msgInput" placeholder="Type a message...">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

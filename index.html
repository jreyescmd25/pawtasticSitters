<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetSitter App</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBJWrY5j423_nacNNRZyk2laI7RD1eWJyQ&callback=initMap" async defer></script>
    <link rel = "icon" href = "/assets/images/pet.png" type = "image/icon">
</head>

<body>

    <div class="paw-bg"></div>

    <nav>
        <h1 class="title">Paw-tastic Sitters!</h1>
        <div>
            <button onclick="location.href='login.html'">Login</button>
            <button onclick="location.href='signup.html'">Sign Up</button>
        </div>
    </nav>

    <section class="hero">
        <h2>Find a Pet Sitter Near You!</h2>
        <div class="search-bar">
            <input type="text" id="zipInput" placeholder="Enter your zip code...">
            <button onclick="searchSitters()">Search</button>
        </div>
        <p id="errorMsg"></p>
    </section>

    <section class="map-section">
        <div id="map"></div>
    </section>


    <section class="featured-sitters">
        <h2 class="section-title">Featured Sitters</h2>
        <div class="sitter-grid" id="sitterGrid">

            <!-- DECOY CARDS - delete when database is connected -->

            <div class="sitter-card">
                <div class="sitter-avatar">🐶</div>
                <h3>Maria Lopez</h3>
                <p class="sitter-location">📍 Bronx, NY</p>
                <div class="sitter-tags">
                    <span class="tag">Dog</span>
                    <span class="tag">Cat</span>
                </div>
                <p class="sitter-rate">$15/hr</p>
                <button onclick="openModal('Maria Lopez')">Message</button>
            </div>

            <div class="sitter-card">
                <div class="sitter-avatar">🐈</div>
                <h3>James Carter</h3>
                <p class="sitter-location">📍 Brooklyn, NY</p>
                <div class="sitter-tags">
                    <span class="tag">Cat</span>
                    <span class="tag">Bird</span>
                </div>
                <p class="sitter-rate">$12/hr</p>
                <button onclick="openModal('James Carter')">Message</button>
            </div>

            <div class="sitter-card">
                <div class="sitter-avatar">🐾</div>
                <h3>Sofia Reyes</h3>
                <p class="sitter-location">📍 Queens, NY</p>
                <div class="sitter-tags">
                    <span class="tag">Dog</span>
                    <span class="tag">Other</span>
                </div>
                <p class="sitter-rate">$18/hr</p>
                <button onclick="openModal('Sofia Reyes')">Message</button>
            </div>

            <!-- END DECOY CARDS -->

            <!-- DATABASE CARDS GO HERE -->

        </div>
    </section>

    <!-- MESSAGE MODAL -->
    <div id="messageModal" style="display:none;">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modalSitterName"></h3>
                <button onclick="closeModal()" class="close-btn">✕</button>
            </div>
            <div class="chat-box" id="chatBox">
                <div class="msg received">Hey! I'm available this weekend 🐾</div>
            </div>
            <div class="chat-input">
                <input type="text" id="msgInput" placeholder="Type a message...">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

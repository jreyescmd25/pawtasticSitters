<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmed!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="paw-bg"></div>

    <nav>
        <h1 class="title" onclick="location.href='index.html'" style="cursor:pointer">Paw-tastic Sitters!</h1>
    </nav>

    <section class="form-section">
        <div class="form-box" style="width:500px; gap:20px; text-align:center;">
            <h2>Request Sent!</h2>
            <p class="switch-page" style="color:white; font-size:16px;" id="successMsg"></p>
            <p class="switch-page" style="color:rgba(255,255,255,0.5);" id="successDetails"></p>
            <button onclick="location.href='bookings.html'">View My Bookings</button>
            <button onclick="location.href='index.html'" style="background:rgba(255,255,255,0.1);">Back to Home</button>
        </div>
    </section>

    <script src="script.js"></script>
    <script>
        const last = JSON.parse(localStorage.getItem("appointments") || "[]").slice(-1)[0];
        if (last) {
            document.getElementById("successMsg").textContent = `Your booking request with ${last.sitter} has been sent. Please wait for their approval.`;
            document.getElementById("successDetails").textContent = `Appointment: ${last.date} at ${last.time} · ${last.duration} hr(s) · ${last.pet}`;
        }
    </script>
</body>
</html>

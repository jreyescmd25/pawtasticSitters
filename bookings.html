<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="paw-bg"></div>

    <nav>
        <h1 class="title" onclick="location.href='index.html'" style="cursor:pointer">Paw-tastic Sitters!</h1>
        <div>
            <button onclick="location.href='profile.html'">My Profile</button>
            <button onclick="logout()">Logout</button>
        </div>
    </nav>

    <section class="featured-sitters">
        <h2 class="section-title">My Bookings</h2>
        <div id="bookingsList" class="sitter-grid"></div>
        <p id="noBookings" class="switch-page" style="color:white; display:none; font-size:18px;">No bookings yet! Search for a sitter to get started.</p>
    </section>

    <script src="script.js"></script>
    <script>
        if (!localStorage.getItem("loggedIn")) location.href = "login.html";

        const role = localStorage.getItem("userRole");
        const list = document.getElementById("bookingsList");

        async function loadBookings() {
            const db = window.supabase.createClient(
                "https://nkerqwvpxcalmcrycddz.supabase.co",
                "sb_publishable_w8R2SnJ_556KppVmF4ULCQ_H3KI1MVo"
            );

            let query;
            if (role === "sitter") {
                const fullName = localStorage.getItem("userFirstName") + " " + localStorage.getItem("userLastName");
                query = await db.from("bookings").select("*").eq("sitter_name", fullName);
            } else {
                query = await db.from("bookings").select("*").eq("owner_email", localStorage.getItem("userEmail"));
            }

            const { data, error } = query;

            if (error || !data || data.length === 0) {
                document.getElementById("noBookings").style.display = "block";
                return;
            }

            data.forEach((b) => {
                const statusColor = b.status === "Accepted" ? "rgba(0,255,100,0.2)" :
                                    b.status === "Declined" ? "rgba(255,0,0,0.2)" : "rgba(255,200,0,0.2)";
                const statusTextColor = b.status === "Accepted" ? "lightgreen" :
                                        b.status === "Declined" ? "salmon" : "gold";

                const actionButtons = role === "sitter" ? `
                    ${b.status === "Pending" ? `
                        <button onclick="acceptBooking('${b.id}')" style="background:rgba(0,255,100,0.3); font-size:14px; padding:8px 15px;">Accept</button>
                        <button onclick="declineBooking('${b.id}')" style="background:rgba(255,0,0,0.3); font-size:14px; padding:8px 15px;">Decline</button>
                    ` : ''}
                    <button onclick="openModal('${b.sitter_name}')" style="font-size:14px; padding:8px 15px;">Message</button>
                ` : `
                    <button onclick="cancelBooking('${b.id}')" style="background:rgba(255,0,0,0.3); font-size:14px; padding:8px 15px;">Cancel</button>
                    <button onclick="openModal('${b.sitter_name}')" style="font-size:14px; padding:8px 15px;">Message</button>
                `;

                list.innerHTML += `
                    <div class="sitter-card">
                        <h3>${b.sitter_name}</h3>
                        <p class="sitter-location">Appointment: ${b.date} at ${b.time}</p>
                        <p class="sitter-location">Duration: ${b.duration} hr(s)</p>
                        <p class="sitter-location">Pet: ${b.pet}</p>
                        <span class="tag" style="background:${statusColor}; color:${statusTextColor};">${b.status}</span>
                        ${b.notes ? `<p class="sitter-location" style="font-size:12px;">Note: ${b.notes}</p>` : ''}
                        ${actionButtons}
                    </div>
                `;
            });
        }

        async function acceptBooking(id) {
            const db = window.supabase.createClient("https://nkerqwvpxcalmcrycddz.supabase.co","sb_publishable_w8R2SnJ_556KppVmF4ULCQ_H3KI1MVo");
            await db.from("bookings").update({ status: "Accepted" }).eq("id", id);
            location.reload();
        }

        async function declineBooking(id) {
            const db = window.supabase.createClient("https://nkerqwvpxcalmcrycddz.supabase.co","sb_publishable_w8R2SnJ_556KppVmF4ULCQ_H3KI1MVo");
            await db.from("bookings").update({ status: "Declined" }).eq("id", id);
            location.reload();
        }

        async function cancelBooking(id) {
            const db = window.supabase.createClient("https://nkerqwvpxcalmcrycddz.supabase.co","sb_publishable_w8R2SnJ_556KppVmF4ULCQ_H3KI1MVo");
            await db.from("bookings").delete().eq("id", id);
            location.reload();
        }

        function openModal(name) {
            document.getElementById("modalSitterName").textContent = "Chat with " + name;
            document.getElementById("messageModal").style.display = "flex";
            const chatBox = document.getElementById("chatBox");
            chatBox.innerHTML = '';
            const messages = JSON.parse(localStorage.getItem("chat_" + name) || "[]");
            messages.forEach(m => { chatBox.innerHTML += `<div class="msg ${m.type}">${m.text}</div>`; });
            chatBox.scrollTop = chatBox.scrollHeight;
            document.getElementById("msgInput").onkeydown = function(e) { if (e.key === "Enter") sendMessage(); };
        }

        function closeModal() { document.getElementById("messageModal").style.display = "none"; }

        function sendMessage() {
            const input = document.getElementById("msgInput");
            const msg = input.value.trim();
            const name = document.getElementById("modalSitterName").textContent.replace("Chat with ", "");
            if (!msg) return;
            const chatBox = document.getElementById("chatBox");
            chatBox.innerHTML += `<div class="msg sent">${msg}</div>`;
            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;
            const messages = JSON.parse(localStorage.getItem("chat_" + name) || "[]");
            messages.push({ type: "sent", text: msg });
            localStorage.setItem("chat_" + name, JSON.stringify(messages));
        }

        loadBookings();
    </script>

    <!-- Cancel confirmation modal -->
    <div id="cancelPrompt" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:999; justify-content:center; align-items:center;">
        <div class="form-box" style="width:350px; gap:15px;">
            <h2>Cancel Booking?</h2>
            <p class="switch-page" style="color:white;">Are you sure you want to cancel this booking?</p>
            <button onclick="confirmCancel()">Yes, Cancel It</button>
            <button onclick="document.getElementById('cancelPrompt').style.display='none'" style="background:rgba(255,255,255,0.1);">Keep Booking</button>
        </div>
    </div>

    <!-- Message modal -->
    <div id="messageModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:999; justify-content:center; align-items:center;">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modalSitterName"></h3>
                <button onclick="closeModal()" class="close-btn">✕</button>
            </div>
            <div class="chat-box" id="chatBox"></div>
            <div class="chat-input">
                <input type="text" id="msgInput" placeholder="Type a message...">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

</body>
</html>

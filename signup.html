<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Paw-tastic Sitters</title>
    <!-- Supabase CDN - connects to cloud database provided by Antoine -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="paw-bg"></div>
    
    <nav>
        <h1 class="title" onclick="location.href='index.html'" style="cursor:pointer">Paw-tastic Sitters!</h1>
    </nav>

    <section class="form-section">
        <div class="form-box">
            <h2>Create Account</h2>

            <!-- STEP 1: Role selection - sets selectedRole variable in script.js -->
            <div id="roleSelection">
                <p class="switch-page">I am a...</p>
                <div style="display:flex; gap:15px; justify-content:center;">
                    <button id="ownerBtn" onclick="selectRole('owner')">Pet Owner</button>
                    <button id="sitterBtn" onclick="selectRole('sitter')">Pet Sitter</button>
                </div>
            </div>

            <!-- STEP 2: Basic info - shown after role is selected -->
            <div id="basicInfo" style="display:none; flex-direction:column; gap:8px;">
                <input type="text" placeholder="First Name" id="signupFirstName" oninput="validateLetters(this, 'firstNameError')">
                <p class="field-error" id="firstNameError"></p>
                <input type="text" placeholder="Last Name" id="signupLastName" oninput="validateLetters(this, 'lastNameError')">
                <p class="field-error" id="lastNameError"></p>
                <input type="text" placeholder="Email" id="signupEmail" oninput="validateEmail(this)">
                <p class="field-error" id="emailError"></p>
                <input type="password" placeholder="Password" id="signupPassword" oninput="validatePassword(this)">
                <p class="field-error" id="passwordError"></p>
                <input type="password" placeholder="Confirm Password" id="signupConfirm" oninput="validateConfirm(this)">
                <p class="field-error" id="confirmError"></p>
                <input type="text" placeholder="@username" id="signupUsername" oninput="validateUsername(this)" onfocus="addAt(this)">
                <p class="field-error" id="usernameError"></p>
                <p class="switch-page">Choose your avatar</p>
                <!-- Avatar selection - sets selectedAvatar variable in script.js -->
                <div id="avatarSelect" style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
                    <button class="tag-btn" onclick="selectAvatar(this, '🐶')">🐶</button>
                    <button class="tag-btn" onclick="selectAvatar(this, '🐱')">🐱</button>
                    <button class="tag-btn" onclick="selectAvatar(this, '🐾')">🐾</button>
                    <button class="tag-btn" onclick="selectAvatar(this, '🦴')">🦴</button>
                    <button class="tag-btn" onclick="selectAvatar(this, '🐠')">🐠</button>
                    <button class="tag-btn" onclick="selectAvatar(this, '🐦')">🐦</button>
                </div>
            </div>

            <!-- STEP 3: Sitter only - shown when role is sitter -->
            <!-- backend: location, rate, tags sent to /api/register as sitter profile data -->
            <div id="sitterDetails" style="display:none; flex-direction:column; gap:8px;">
                <input type="text" placeholder="Your Zip Code" id="sitterLocation" oninput="validateZip(this)" maxlength="5">
                <p class="field-error" id="zipError"></p>
                <!-- Auto-detects NYC borough from zip -->
                <p id="boroughMsg" class="switch-page" style="color:white;"></p>
                <p class="switch-page">Specialty (select all that apply)</p>
                <!-- Sets selectedTags array in script.js -->
                <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
                    <button class="tag-btn" onclick="toggleTag(this, 'Dog')">Dog</button>
                    <button class="tag-btn" onclick="toggleTag(this, 'Cat')">Cat</button>
                    <button class="tag-btn" onclick="toggleTag(this, 'Bird')">Bird</button>
                    <button class="tag-btn" onclick="toggleTag(this, 'Other')">Other</button>
                </div>
                <input type="number" placeholder="Hourly Rate ($/hr)" id="hourlyRate">
            </div>

            <!-- Shown after role is selected -->
            <!-- backend: handleSignup() sends all data to /api/register -->
            <button id="submitBtn" style="display:none;" onclick="handleSignup()">Create Account</button>
            <p class="switch-page">Already have an account? <span onclick="location.href='login.html'">Login</span></p>
        </div>
    </section>
    <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="script.js"></script>
</body>
</html>
